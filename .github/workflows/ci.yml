name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: the `cache: pnpm` option below shells out to
      # pnpm to locate its store, so pnpm has to be on PATH first. The pnpm
      # version is not pinned here — action-setup reads it from the
      # `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          # One lockfile at the root covers every workspace package.
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile fails the build if the lockfile is out of sync with a
      # package.json rather than silently resolving new versions, so CI installs
      # exactly what was reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
